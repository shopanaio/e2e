mutation ProductCreate($input: ProductCreateInput!) {
  inventoryMutation {
    productCreate(input: $input) {
      product {
        id
        title
        variants(first: 10) {
          edges {
            node {
              id
              sku
            }
          }
        }
      }
      userErrors {
        message
        code
      }
    }
  }
}
